<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Syed Yavar Ahmed - CV Maker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>CV Maker</h1>
    <p>Create Your Professional CV</p>

    <!-- FORM -->
    <div class="form-section">

      <h2>Personal Information</h2>

      <input id="name"
             value="Syed Yavar Ahmed"
             placeholder="Full Name">

      <input id="email"
             placeholder="Email Address">

      <input id="phone"
             placeholder="Phone Number">

      <input id="address"
             placeholder="Address">

      <h2>Education</h2>

      <textarea id="education"
                placeholder="Your education"></textarea>

      <h2>Skills</h2>

      <textarea id="skills"
                placeholder="Your skills"></textarea>

      <h2>Experience</h2>

      <textarea id="experience"
                placeholder="Your work experience"></textarea>

      <button onclick="generateCV()">
        Generate CV
      </button>

    </div>


    <!-- CV PREVIEW -->
    <div class="cv-preview">

      <h1 id="preview-name">
        Syed Yavar Ahmed
      </h1>

      <p id="preview-contact">
        Email | Phone | Address
      </p>

      <h2>Education</h2>
      <p id="preview-education">
        Your education will appear here.
      </p>

      <h2>Skills</h2>
      <p id="preview-skills">
        Your skills will appear here.
      </p>

      <h2>Experience</h2>
      <p id="preview-experience">
        Your experience will appear here.
      </p>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
